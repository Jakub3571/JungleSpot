          - { label: "Oferta — punkt 12", name: "oferta-12", widget: "string" }
          - { label: "Oferta — punkt 13", name: "oferta-13", widget: "string" }
          - label: "Tytuł sekcji: Galeria"
            name: "galeria-title"
