            name: "cennik-nr2-przycisk"
            widget: "string"
          - label: "Cennik 3 — nazwa pakietu"
            name: "cennik-nr3-nazwa"
            widget: "string"
          - label: "Cennik 3 — czas trwania"
            name: "cennik-nr3-czas"
            widget: "string"
          - { label: "Cennik 3 — punkt 1", name: "cennik-nr3-1", widget: "string" }
          - { label: "Cennik 3 — punkt 2", name: "cennik-nr3-2", widget: "string" }
