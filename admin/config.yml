backend:
  name: git-gateway
  branch: main

site_url: https://junglespot.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "tresci"
    label: "Treści na stronie"
    editor:
      preview: false
    files:
      # ---------- STRONA GŁÓWNA ----------
      - name: "strona-glowna"
        label: "🏠 Strona główna"
        file: "content.json"
        fields:
          - label: "Nagłówek główny (duży, u góry)"
            name: "hero-title"
            widget: "text"
          - label: "Adres"
            name: "hero-address"
            widget: "string"
          - label: "Telefon"
            name: "hero-phone"
            widget: "string"
          - label: "E-mail"
            name: "hero-email"
            widget: "string"
          - label: "Tytuł sekcji: O nas"
            name: "onas-title"
            widget: "string"
          - label: "Tekst sekcji: O nas"
            name: "onas-text"
            widget: "text"
          - label: "Tytuł sekcji: Co oferujemy"
            name: "oferta-title"
            widget: "string"
          - { label: "Oferta — punkt 1", name: "oferta-1", widget: "string" }
